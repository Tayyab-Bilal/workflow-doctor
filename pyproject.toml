[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "workflow-doctor"
version = "0.1.0"
description = "Build automation workflows from plain language, and diagnose why they fail."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/workflow_doctor"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "tests", "examples"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
